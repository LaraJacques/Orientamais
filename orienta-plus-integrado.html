<title>Orienta+ — Orientação vocacional</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --bg:#FAF7F1;
    --surface:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#4B5563;
    --navy:#3D40A0;
    --navy-deep:#2B2D7C;
    --teal:#2F6F62;
    --amber:#FF6B35;
    --rose:#C9594B;
    --plum:#6B5B7A;
    --line:#DDD6C7;
    --line-soft:#EAE4D6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    color:var(--navy-deep);
    margin:0 0 .4em 0;
    letter-spacing:-0.01em;
  }
  p{margin:0 0 1em 0; color:var(--ink-soft);}
  a{color:inherit;}
  button{font-family:inherit;}
  #app{max-width:1080px;margin:0 auto;padding:0 24px 80px;}

  /* NAV */
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 24px;max-width:1080px;margin:0 auto;
    border-bottom:1px solid var(--line-soft);
  }
  .nav-logo{display:inline-flex;align-items:center;border-radius:8px;}
  .nav-logo img{display:block;height:38px;width:auto;}
  .nav-logo:focus-visible,.nav-links button:focus-visible,.btn:focus-visible{outline:3px solid var(--amber);outline-offset:3px;}
  .footer-logo{display:block;height:44px;width:auto;margin:0 auto 14px;}
  .nav-links{display:flex;gap:6px;flex-wrap:wrap;}
  .nav-links button{
    background:none;border:none;padding:9px 14px;border-radius:7px;
    font-size:0.92rem;color:var(--ink-soft);cursor:pointer;transition:background .15s;
  }
  .nav-links button:hover{background:var(--line-soft);color:var(--ink);}
  .nav-links button.active{background:var(--navy-deep);color:#fff;}

  /* HERO */
  .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:64px 0 56px;}
  .hero h1{font-size:2.7rem;line-height:1.08;max-width:11.5ch;}
  .hero p.lede{font-size:1.08rem;max-width:46ch;}
  .hero-ctas{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;}
  .btn{
    display:inline-block;padding:13px 22px;border-radius:8px;border:none;font-size:0.96rem;
    font-weight:600;cursor:pointer;text-decoration:none;
  }
  .btn-primary{background:var(--navy-deep);color:#fff;}
  .btn-primary:hover{background:var(--navy);}
  .btn-ghost{background:transparent;color:var(--navy-deep);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy-deep);}

  .path-svg{width:100%;height:auto;}

  .how{padding:40px 0 8px;border-top:1px solid var(--line-soft);}
  .how-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:28px;}
  .how-step .num{
    font-family:'Fraunces',serif;font-size:1.5rem;color:var(--amber);font-weight:700;margin-bottom:6px;
  }
  .how-step h3{font-size:1.08rem;margin-bottom:6px;}
  .how-step p{font-size:0.93rem;}

  .teaser{
    margin-top:52px;padding:22px 26px;background:var(--surface);border:1px solid var(--line-soft);
    border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .teaser p{margin:0;font-size:0.92rem;max-width:52ch;}
  .badge-soon{
    font-size:0.72rem;color:var(--teal);border:1px solid var(--teal);border-radius:20px;padding:3px 10px;
    white-space:nowrap;
  }

  /* SECTION HEADERS */
  .section-head{padding:44px 0 8px;}
  .section-head h2{font-size:1.9rem;}
  .section-head p{max-width:60ch;font-size:1rem;}

  /* QUIZ */
  .quiz-progress{
    height:6px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin:18px 0 30px;
  }
  .quiz-progress-fill{height:100%;background:var(--teal);transition:width .25s;}
  .quiz-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:34px;}
  .quiz-q{font-size:1.25rem;font-family:'Fraunces',serif;font-weight:600;margin-bottom:22px;color:var(--navy-deep);}
  .quiz-options{display:flex;flex-direction:column;gap:10px;}
  .quiz-option{
    text-align:left;padding:15px 18px;border:1.5px solid var(--line);border-radius:9px;background:#fff;
    cursor:pointer;font-size:0.96rem;color:var(--ink);transition:border-color .15s,background .15s;
  }
  .quiz-option:hover{border-color:var(--navy-deep);background:#FBFAF6;}

  /* RESULT */
  .area-bars{display:flex;flex-direction:column;gap:14px;margin:24px 0 40px;}
  .area-bar-row{display:grid;grid-template-columns:130px 1fr 40px;align-items:center;gap:12px;font-size:0.92rem;}
  .area-bar-track{height:10px;background:var(--line-soft);border-radius:6px;overflow:hidden;}
  .area-bar-fill{height:100%;border-radius:6px;}
  .result-lede{font-size:1.05rem;color:var(--ink);max-width:60ch;}
  .career-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;}

  /* CAREER CARDS */
  .career-card{
    background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:22px;
    display:flex;flex-direction:column;gap:8px;
  }
  .career-card h3{font-size:1.12rem;margin-bottom:2px;}
  .area-tag{
    display:inline-block;font-size:0.72rem;padding:3px 9px;border-radius:20px;color:#fff;width:fit-content;
    margin-bottom:4px;
  }
  .career-card .fact{font-size:0.87rem;color:var(--ink-soft);}
  .career-card .fact b{color:var(--ink);font-weight:600;}

  /* COMPARE */
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 30px;}
  .chip{
    padding:9px 15px;border-radius:20px;border:1.5px solid var(--line);background:#fff;cursor:pointer;
    font-size:0.88rem;color:var(--ink-soft);
  }
  .chip.selected{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff;}
  .chip:disabled{opacity:.4;cursor:not-allowed;}
  .compare-hint{font-size:0.85rem;color:var(--ink-soft);margin-top:-16px;margin-bottom:22px;}

  .compare-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--line-soft);}
  .compare-table th,.compare-table td{
    padding:16px 18px;text-align:left;vertical-align:top;font-size:0.9rem;border-bottom:1px solid var(--line-soft);
  }
  .compare-table th{
    background:var(--navy-deep);color:#fff;font-family:'Fraunces',serif;font-weight:600;font-size:1rem;
  }
  .compare-table tr:last-child td{border-bottom:none;}
  .compare-table td.row-label{font-weight:600;color:var(--navy-deep);width:150px;background:#F5F1E7;}
  .empty-state{
    padding:40px;text-align:center;color:var(--ink-soft);border:1.5px dashed var(--line);border-radius:12px;
  }

  /* COURSES */
  .filters{
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;background:var(--surface);
    border:1px solid var(--line-soft);border-radius:12px;padding:22px;margin:20px 0 32px;
  }
  .filter-field label{display:block;font-size:0.82rem;color:var(--ink-soft);margin-bottom:6px;}
  .filter-field select{
    width:100%;padding:10px 12px;border-radius:7px;border:1.5px solid var(--line);font-size:0.92rem;
    background:#fff;color:var(--ink);
  }
  .course-list{display:flex;flex-direction:column;gap:14px;}
  .course-card{
    background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:20px 22px;
    display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  }
  .course-card h3{font-size:1.05rem;margin-bottom:3px;}
  .course-meta{font-size:0.86rem;color:var(--ink-soft);}
  .course-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .tag{font-size:0.74rem;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);}
  .price-block{text-align:right;white-space:nowrap;}
  .price-block .price{font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;color:var(--teal);}
  .price-block .dur{font-size:0.78rem;color:var(--ink-soft);}
  .results-count{font-size:0.88rem;color:var(--ink-soft);margin-bottom:14px;}

  footer{
    text-align:center;padding:40px 24px;color:var(--ink-soft);font-size:0.82rem;
    border-top:1px solid var(--line-soft);margin-top:40px;
  }

  @media (max-width:760px){
    .hero{grid-template-columns:1fr;padding-top:40px;}
    .hero h1{font-size:2.1rem;max-width:none;}
    .how-steps{grid-template-columns:1fr;}
    .career-grid{grid-template-columns:1fr;}
    .filters{grid-template-columns:1fr;}
    .course-card{grid-template-columns:1fr;}
    .price-block{text-align:left;}
    .area-bar-row{grid-template-columns:100px 1fr 34px;}
    .nav{flex-direction:column;gap:12px;align-items:flex-start;}
  }

  .status-box{padding:28px;text-align:center;color:var(--ink-soft);border:1.5px dashed var(--line);border-radius:12px;margin:20px 0;}
  .status-box.error{border-color:var(--rose);color:var(--rose);background:#FDF3F1;}
  .status-box .btn{margin-top:12px;}
  .toggle-row{display:flex;align-items:center;gap:10px;margin:0 0 18px;font-size:0.92rem;color:var(--ink);}
  .toggle-row input{width:18px;height:18px;accent-color:var(--navy-deep);}
  .toggle-row.off{color:var(--ink-soft);}
  .score-pill{font-family:'Fraunces',serif;font-weight:700;color:var(--navy-deep);font-size:1.05rem;}
  .motivos{margin:10px 0 0;padding-left:18px;font-size:0.84rem;color:var(--ink-soft);}
  .motivos li{margin-bottom:2px;}
  .flag{font-size:0.78rem;color:var(--ink-soft);margin-top:30px;}
  .best{outline:2px solid var(--teal);outline-offset:-2px;}
</style>
</head>

<script>
/* ================= CONFIGURAÇÃO =================
   Local:    http://localhost:3000/api
   Produção: https://SEU-BACKEND.onrender.com/api   (troque ao publicar) */
const API_URL = 'http://localhost:3000/api';

/* ---------------- API ---------------- */
async function api(caminho, { metodo = 'GET', corpo } = {}) {
  let res;
  try {
    res = await fetch(API_URL + caminho, {
      method: metodo,
      headers: corpo ? { 'Content-Type': 'application/json' } : undefined,
      body: corpo ? JSON.stringify(corpo) : undefined,
    });
  } catch {
    throw new Error('Não foi possível falar com o servidor. Confira se o backend está rodando e se API_URL está correta.');
  }
  const dados = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(dados.erro || `Erro ${res.status} no servidor.`);
  return dados;
}

const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reais = (n) => 'R$ ' + Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
const faixaSalario = (c) => `${reais(c.salario_min)} – ${reais(c.salario_max)}`;
const duracao = (meses) => meses % 12 === 0 ? `${meses / 12} anos` : `${meses} meses`;

const COR_AREA = { exatas:'#2B2D7C', saude:'#2F6F62', criativas:'#D9A21B', negocios:'#C9594B', humanas:'#6B5B7A' };
const corArea = (slug) => COR_AREA[slug] || '#4B5563';

const REGIOES = [
  {v:'', l:'Todas as regiões'}, {v:'norte', l:'Norte'}, {v:'nordeste', l:'Nordeste'},
  {v:'centro-oeste', l:'Centro-Oeste'}, {v:'sudeste', l:'Sudeste'}, {v:'sul', l:'Sul'},
];
const ORCAMENTOS = [
  {v:'', l:'Qualquer valor'}, {v:'0', l:'Somente gratuitos'}, {v:'300', l:'Até R$ 300/mês'},
  {v:'600', l:'Até R$ 600/mês'}, {v:'1000', l:'Até R$ 1.000/mês'},
];

/* ---------------- ESTADO ---------------- */
const state = {
  view: 'home',
  areas: [],
  perguntas: null,          // carregadas da API
  quizStep: 0,
  respostas: [],            // [{pergunta_id, opcao_id}]
  resultado: null,          // resposta de POST /quiz/respostas
  carreiras: null,
  compareSelected: [],
  comparacao: null,
  filters: { regiao:'', orcamento:'', area:'', usarPerfil:false },
  cursos: null,             // { lista, total, modoPerfil, dica }
  carregando: false,
  erro: null,
};

const NAV_ITEMS = [
  {id:'home', label:'Início'}, {id:'quiz', label:'Teste vocacional'},
  {id:'compare', label:'Comparar carreiras'}, {id:'courses', label:'Cursos & faculdades'},
];

/* ---------------- NAVEGAÇÃO ---------------- */
async function go(view) {
  state.view = view;
  state.erro = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  try {
    if (view === 'quiz') await carregarPerguntas();
    if (view === 'compare') await carregarCarreiras();
    if (view === 'courses') { await carregarAreas(); await carregarCursos(); }
    if (view === 'result') await carregarCarreiras();
  } catch (e) { state.erro = e.message; }
  state.carregando = false;
  render();
}

/* ---------------- CARREGAMENTO ---------------- */
async function carregarAreas() {
  if (!state.areas.length) state.areas = (await api('/areas')).areas;
}
async function carregarPerguntas() {
  if (state.perguntas) return;
  state.carregando = true; render();
  state.perguntas = (await api('/quiz/perguntas')).perguntas;
}
async function carregarCarreiras() {
  if (state.carreiras) return;
  state.carregando = true; render();
  state.carreiras = (await api('/carreiras')).carreiras;
}
async function carregarComparacao() {
  if (!state.compareSelected.length) { state.comparacao = null; return; }
  state.comparacao = await api('/carreiras/comparar?slugs=' + state.compareSelected.join(','));
}
async function carregarCursos() {
  state.carregando = true; render();
  const f = state.filters;
  if (f.usarPerfil && state.resultado) {
    const corpo = { pontuacao: state.resultado.pontuacao, limite: 20 };
    if (f.regiao) corpo.regiao = f.regiao;
    if (f.orcamento !== '') corpo.orcamento_max = Number(f.orcamento);
    const r = await api('/recomendacoes', { metodo: 'POST', corpo });
    state.cursos = { lista: r.recomendacoes, total: r.recomendacoes.length, modoPerfil: true, dica: r.dica };
  } else {
    const q = new URLSearchParams({ limite: '50' });
    if (f.regiao) q.set('regiao', f.regiao);
    if (f.orcamento !== '') q.set('orcamento_max', f.orcamento);
    if (f.area) q.set('area', f.area);
    const r = await api('/cursos?' + q);
    state.cursos = { lista: r.cursos, total: r.total, modoPerfil: false, dica: null };
  }
}

/* ---------------- VIEWS ---------------- */
function render() {
  const nav = document.getElementById('navLinks');
  nav.innerHTML = NAV_ITEMS.map((it) => {
    const ativo = state.view === it.id || (it.id === 'quiz' && state.view === 'result');
    return `<button data-nav="${it.id}" class="${ativo ? 'active' : ''}">${it.label}</button>`;
  }).join('');
  nav.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => go(b.dataset.nav)));

  const app = document.getElementById('app');
  const views = { home: viewHome, quiz: viewQuiz, result: viewResult, compare: viewCompare, courses: viewCourses };
  app.innerHTML = views[state.view]();
  attachHandlers();
}

const caixaErro = () => state.erro
  ? `<div class="status-box error">${esc(state.erro)}<br><button class="btn btn-ghost" data-retry>Tentar de novo</button></div>` : '';
const caixaCarregando = (msg = 'Carregando...') => `<div class="status-box">${msg}</div>`;

function pathSvg() {
  return `<svg class="path-svg" viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="40" cy="160" r="7" fill="#2B2D7C"/>
    <path d="M40 160 C 120 60, 180 60, 230 60" stroke="#2B2D7C" stroke-width="2.5" fill="none"/>
    <circle cx="230" cy="60" r="6" fill="#2F6F62"/>
    <path d="M40 160 C 120 160, 180 160, 230 160" stroke="#DDD6C7" stroke-width="2.5" fill="none"/>
    <circle cx="230" cy="160" r="6" fill="#FF6B35"/>
    <path d="M40 160 C 120 260, 180 260, 230 260" stroke="#DDD6C7" stroke-width="2.5" fill="none"/>
    <circle cx="230" cy="260" r="6" fill="#C9594B"/>
    <path d="M230 60 C 300 60, 330 40, 390 40" stroke="#2F6F62" stroke-width="2" fill="none" stroke-dasharray="4 5"/>
    <path d="M230 160 C 300 160, 330 180, 390 180" stroke="#FF6B35" stroke-width="2" fill="none" stroke-dasharray="4 5"/>
    <path d="M230 260 C 300 260, 330 280, 390 280" stroke="#C9594B" stroke-width="2" fill="none" stroke-dasharray="4 5"/>
    <text x="16" y="188" font-family="IBM Plex Sans" font-size="12" fill="#4B5563">você</text>
    <text x="216" y="42" font-family="IBM Plex Sans" font-size="12" fill="#4B5563">interesses</text>
    <text x="358" y="34" font-family="IBM Plex Sans" font-size="11" fill="#4B5563">carreira</text>
    <text x="358" y="174" font-family="IBM Plex Sans" font-size="11" fill="#4B5563">carreira</text>
    <text x="358" y="274" font-family="IBM Plex Sans" font-size="11" fill="#4B5563">carreira</text>
  </svg>`;
}

function viewHome() {
  return `
  <section class="hero">
    <div>
      <h1>Escolher uma carreira não devia ser um chute.</h1>
      <p class="lede">O Orienta+ cruza seus interesses com dados sobre rotina, salário e mercado de trabalho, e te mostra cursos que cabem no seu orçamento e ficam perto de você.</p>
      <div class="hero-ctas">
        <a class="btn btn-primary" onclick="go('quiz')">Fazer o teste vocacional</a>
        <a class="btn btn-ghost" onclick="go('compare')">Comparar carreiras direto</a>
      </div>
    </div>
    <div>${pathSvg()}</div>
  </section>
  <section class="how">
    <h2 style="font-size:1.5rem;">Como funciona</h2>
    <div class="how-steps">
      <div class="how-step"><div class="num">1</div><h3>Responda ao teste</h3><p>Seis perguntas rápidas sobre o que te move — nada de decorar disciplinas.</p></div>
      <div class="how-step"><div class="num">2</div><h3>Veja carreiras lado a lado</h3><p>Rotina do dia a dia, faixa salarial e como está o mercado.</p></div>
      <div class="how-step"><div class="num">3</div><h3>Encontre um curso que caiba no seu bolso</h3><p>Filtre por região e orçamento, ou deixe o Orienta+ ordenar pelo seu perfil.</p></div>
    </div>
    <div class="teaser">
      <p>Você é orientador ou orientadora pedagógica? Um painel com a visão consolidada da turma está em desenvolvimento.</p>
      <span class="badge-soon">Módulo do orientador · em breve</span>
    </div>
  </section>`;
}

function viewQuiz() {
  const cabecalho = `<section class="section-head"><h2>Teste vocacional</h2>`;
  if (state.erro) return cabecalho + `</section>` + caixaErro();
  if (!state.perguntas) return cabecalho + `</section>` + caixaCarregando('Carregando perguntas...');
  const total = state.perguntas.length;
  const p = state.perguntas[state.quizStep];
  const pct = Math.round((state.quizStep / total) * 100);
  return `${cabecalho}
    <p>Pergunta ${state.quizStep + 1} de ${total}. Escolha a opção que mais parece com você — não existe resposta errada.</p></section>
    <div class="quiz-progress"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
    <div class="quiz-card">
      <div class="quiz-q">${esc(p.texto)}</div>
      <div class="quiz-options">
        ${p.opcoes.map((o) => `<button class="quiz-option" data-opcao="${o.id}">${esc(o.texto)}</button>`).join('')}
      </div>
      ${state.quizStep > 0 ? `<p style="margin-top:18px;"><a href="#" data-voltar style="font-size:0.88rem;">← Voltar para a pergunta anterior</a></p>` : ''}
    </div>`;
}

async function responderQuiz(opcaoId) {
  const p = state.perguntas[state.quizStep];
  state.respostas[state.quizStep] = { pergunta_id: p.id, opcao_id: Number(opcaoId) };
  state.quizStep++;
  if (state.quizStep < state.perguntas.length) return render();

  state.carregando = true; state.erro = null;
  document.getElementById('app').innerHTML = caixaCarregando('Calculando seu perfil...');
  try {
    state.resultado = await api('/quiz/respostas', { metodo: 'POST', corpo: { respostas: state.respostas } });
    state.filters.usarPerfil = true;
    await go('result');
  } catch (e) {
    state.quizStep = state.perguntas.length - 1; // deixa o aluno tentar de novo na última pergunta
    state.erro = e.message; state.carregando = false;
    state.view = 'quiz'; render();
  }
}

function refazerQuiz() {
  state.quizStep = 0; state.respostas = []; state.resultado = null;
  state.filters.usarPerfil = false; state.cursos = null;
  go('quiz');
}

function cartaoCarreira(c) {
  return `<div class="career-card">
    <span class="area-tag" style="background:${corArea(c.area)}">${esc(c.area_nome)}</span>
    <h3>${esc(c.nome)}</h3>
    <p class="fact"><b>Rotina:</b> ${esc(c.rotina)}</p>
    <p class="fact"><b>Salário médio:</b> ${faixaSalario(c)}</p>
    <p class="fact"><b>Mercado:</b> ${esc(c.mercado)}</p>
  </div>`;
}

function viewResult() {
  const r = state.resultado;
  if (!r) return `<section class="section-head"><h2>Seu perfil</h2></section><div class="status-box">Faça o teste para ver seu perfil. <br><button class="btn btn-primary" onclick="go('quiz')">Ir para o teste</button></div>`;
  const principal = r.ranking[0];
  const sugestoes = (state.carreiras || []).filter((c) => r.areas_empatadas.includes(c.area))
    .sort((a, b) => b.mercado_nivel - a.mercado_nivel).slice(0, 2);
  const texto = r.empate
    ? `Você ficou empatado(a) entre <b>${r.ranking.filter((x) => r.areas_empatadas.includes(x.area)).map((x) => esc(x.nome)).join('</b> e <b>')}</b>. Vale explorar as duas.`
    : `Sua área com mais afinidade foi <b>${esc(principal.nome)}</b>.`;
  return `
  <section class="section-head">
    <h2>Seu perfil de interesses</h2>
    <p class="result-lede">${texto} Isso não é uma sentença — é um ponto de partida para explorar carreiras com mais chance de fazer sentido pra você.</p>
  </section>
  ${caixaErro()}
  <div class="area-bars">
    ${r.ranking.map((a) => `
      <div class="area-bar-row">
        <span>${esc(a.nome)}</span>
        <div class="area-bar-track"><div class="area-bar-fill" style="width:${a.percentual}%;background:${corArea(a.area)}"></div></div>
        <span>${Math.round(a.percentual)}%</span>
      </div>`).join('')}
  </div>
  <h3 style="font-size:1.15rem;margin-bottom:12px;">Carreiras para começar a explorar</h3>
  <div class="career-grid">${sugestoes.map(cartaoCarreira).join('')}</div>
  <div class="hero-ctas" style="margin-top:26px;">
    <a class="btn btn-primary" data-comparar-resultado="${sugestoes.map((c) => c.slug).join(',')}">Ver comparação completa</a>
    <a class="btn btn-ghost" onclick="go('courses')">Ver cursos para o meu perfil</a>
    <a class="btn btn-ghost" data-refazer>Refazer o teste</a>
  </div>`;
}

function viewCompare() {
  const cab = `<section class="section-head"><h2>Comparar carreiras</h2>
    <p>Escolha até 3 carreiras para comparar rotina, salário, mercado de trabalho e formação necessária, lado a lado.</p></section>`;
  if (state.erro) return cab + caixaErro();
  if (!state.carreiras) return cab + caixaCarregando('Carregando carreiras...');
  const sel = state.compareSelected;
  return `${cab}
    <div class="chip-row">
      ${state.carreiras.map((c) => {
        const marcado = sel.includes(c.slug);
        const bloqueado = !marcado && sel.length >= 3;
        return `<button class="chip ${marcado ? 'selected' : ''}" data-carreira="${esc(c.slug)}" ${bloqueado ? 'disabled' : ''}>${esc(c.nome)}</button>`;
      }).join('')}
    </div>
    ${!sel.length ? `<div class="empty-state">Selecione ao menos uma carreira acima para começar a comparação.</div>`
      : !state.comparacao ? caixaCarregando('Comparando...') : tabelaComparacao(state.comparacao)}`;
}

function tabelaComparacao({ carreiras, destaques }) {
  const d = destaques || {};
  const marca = (chave, c) => d[chave] === c.slug ? 'best' : '';
  const linhas = [
    ['Área', (c) => `<span class="area-tag" style="background:${corArea(c.area)}">${esc(c.area_nome)}</span>`],
    ['Rotina', (c) => esc(c.rotina)],
    ['Salário médio', (c) => `${faixaSalario(c)}<br><small>média: ${reais(c.salario_medio)}</small>`, 'maior_salario_maximo'],
    ['Mercado de trabalho', (c) => `<b>Demanda ${esc(c.demanda_rotulo.toLowerCase())}.</b> ${esc(c.mercado)}`, 'maior_demanda'],
    ['Formação necessária', (c) => `${esc(c.formacao)}${c.duracao_anos ? `<br><small>${c.duracao_anos} anos</small>` : ''}`, 'menor_duracao'],
  ];
  const ilustrativo = carreiras.some((c) => c.ilustrativo);
  return `<table class="compare-table">
    <tr><th></th>${carreiras.map((c) => `<th>${esc(c.nome)}</th>`).join('')}</tr>
    ${linhas.map(([rotulo, fn, chave]) => `<tr><td class="row-label">${rotulo}</td>${carreiras.map((c) => `<td class="${chave ? marca(chave, c) : ''}">${fn(c)}</td>`).join('')}</tr>`).join('')}
  </table>
  <p class="flag">${carreiras.length > 1 ? 'Contorno verde = melhor valor da linha entre as carreiras comparadas. ' : ''}${ilustrativo ? 'Valores ilustrativos, ainda não vêm de fonte oficial.' : ''}</p>`;
}

function viewCourses() {
  const f = state.filters;
  const temPerfil = !!state.resultado;
  const cab = `<section class="section-head"><h2>Cursos & faculdades</h2>
    <p>Filtre por região e orçamento para ver cursos técnicos e superiores que cabem na sua realidade.</p></section>`;
  const opts = (lista, atual) => lista.map((o) => `<option value="${o.v}" ${atual === o.v ? 'selected' : ''}>${o.l}</option>`).join('');
  const filtros = `
    <div class="toggle-row ${temPerfil ? '' : 'off'}">
      <input type="checkbox" id="fPerfil" ${f.usarPerfil && temPerfil ? 'checked' : ''} ${temPerfil ? '' : 'disabled'}>
      <label for="fPerfil">${temPerfil ? 'Ordenar pelo meu perfil do teste vocacional' : 'Faça o teste vocacional para ordenar os cursos pelo seu perfil'}</label>
    </div>
    <div class="filters">
      <div class="filter-field"><label for="fRegiao">Região</label><select id="fRegiao">${opts(REGIOES, f.regiao)}</select></div>
      <div class="filter-field"><label for="fOrc">Orçamento mensal</label><select id="fOrc">${opts(ORCAMENTOS, f.orcamento)}</select></div>
      <div class="filter-field"><label for="fArea">Área de interesse</label>
        <select id="fArea" ${f.usarPerfil && temPerfil ? 'disabled' : ''}>
          <option value="">Todas as áreas</option>
          ${state.areas.map((a) => `<option value="${esc(a.slug)}" ${f.area === a.slug ? 'selected' : ''}>${esc(a.nome)}</option>`).join('')}
        </select></div>
    </div>`;
  if (state.erro) return cab + filtros + caixaErro();
  if (!state.cursos || state.carregando) return cab + filtros + caixaCarregando('Buscando cursos...');

  const { lista, total, modoPerfil, dica } = state.cursos;
  return `${cab}${filtros}
    <p class="results-count">${total} curso${total === 1 ? '' : 's'} encontrado${total === 1 ? '' : 's'}${modoPerfil ? ' · ordenados pela compatibilidade com o seu perfil' : ''}</p>
    <div class="course-list">
      ${lista.length === 0 ? `<div class="empty-state">${esc(dica || 'Nenhum curso bate com esses filtros. Tente ampliar a região ou o orçamento.')}</div>`
        : lista.map(cartaoCurso).join('')}
    </div>
    ${lista.some((c) => c.ilustrativo) ? `<p class="flag">Valores e instituições ilustrativos — confirme no site da instituição antes de decidir.</p>` : ''}`;
}

function cartaoCurso(c) {
  const preco = c.mensalidade === 0 ? 'Gratuita' : reais(c.mensalidade);
  const modal = { presencial: 'Presencial', ead: 'EAD', hibrido: 'Híbrido' }[c.modalidade];
  return `<div class="course-card">
    <div>
      <h3>${esc(c.nome)}</h3>
      <div class="course-meta">${esc(c.instituicao)} · ${esc(c.cidade)}/${esc(c.uf)}</div>
      <div class="course-tags">
        <span class="tag">${c.nivel === 'tecnico' ? 'Técnico' : 'Superior'}</span>
        <span class="tag">${modal}</span>
        <span class="tag">${duracao(c.duracao_meses)}</span>
        <span class="tag">${esc(c.area_nome)}</span>
      </div>
      ${c.motivos ? `<ul class="motivos">${c.motivos.map((m) => `<li>${esc(m)}</li>`).join('')}</ul>` : ''}
    </div>
    <div class="price-block">
      <div class="price">${preco}</div>
      <div class="dur">${c.mensalidade === 0 ? 'rede pública' : 'mensalidade'}</div>
      ${c.score !== undefined ? `<div class="score-pill" title="Compatibilidade com o seu perfil">${Math.round(c.score)}/100</div>` : ''}
    </div>
  </div>`;
}

/* ---------------- EVENTOS ---------------- */
function attachHandlers() {
  const $$ = (s) => document.querySelectorAll(s);
  $$('.quiz-option').forEach((b) => b.addEventListener('click', () => responderQuiz(b.dataset.opcao)));
  $$('[data-voltar]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); state.quizStep--; render(); }));
  $$('[data-retry]').forEach((b) => b.addEventListener('click', () => go(state.view)));
  $$('[data-refazer]').forEach((b) => b.addEventListener('click', refazerQuiz));
  $$('[data-comparar-resultado]').forEach((b) => b.addEventListener('click', async () => {
    state.compareSelected = b.dataset.compararResultado.split(',').filter(Boolean);
    state.comparacao = null;
    await go('compare');
    try { await carregarComparacao(); } catch (e) { state.erro = e.message; }
    render();
  }));
  $$('.chip[data-carreira]').forEach((b) => b.addEventListener('click', async () => {
    const slug = b.dataset.carreira, i = state.compareSelected.indexOf(slug);
    if (i >= 0) state.compareSelected.splice(i, 1);
    else if (state.compareSelected.length < 3) state.compareSelected.push(slug);
    state.comparacao = null; state.erro = null; render();
    try { await carregarComparacao(); } catch (e) { state.erro = e.message; }
    render();
  }));

  const atualizarCursos = async () => {
    state.erro = null;
    try { await carregarCursos(); } catch (e) { state.erro = e.message; }
    state.carregando = false; render();
  };
  const ligar = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('change', fn); };
  ligar('fRegiao', (e) => { state.filters.regiao = e.target.value; atualizarCursos(); });
  ligar('fOrc', (e) => { state.filters.orcamento = e.target.value; atualizarCursos(); });
  ligar('fArea', (e) => { state.filters.area = e.target.value; atualizarCursos(); });
  ligar('fPerfil', (e) => { state.filters.usarPerfil = e.target.checked; atualizarCursos(); });
}

render();
</script>
</body>
</html>
